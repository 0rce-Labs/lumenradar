name: ci

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Self-hosted ARM64 runner (hosted runners unusable: org billing lock).
    # NOTE: no pull_request trigger on purpose — this is a public repo running
    # on a self-hosted machine; PR code must never execute here.
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        run: |
          python3 --version
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install -q --upgrade pip
          .venv-ci/bin/pip install -q -e ".[dev]"
      - name: Lint
        run: .venv-ci/bin/ruff check src tests scripts
      - name: Test
        run: .venv-ci/bin/python -m pytest
