[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumenradar"
version = "0.2.0"
description = "Detection of covert optical signaling (LED blink / backlight pulse / screen flash) in camera footage. Defensive tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samet Yilmaz Temel" }, { name = "0rce-Labs" }]
keywords = ["covert-channel", "optical", "detection", "proctoring", "security", "forensics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
lumenradar = "lumenradar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lumenradar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
